<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="stylesheet" href="../../hub.css?v=5">
<link rel="icon" href="../../icon-192.png">
<title>Contrôle des temps – Demi-fond EPS</title>
</head>
<body>
<main class="page">
  <a class="back noprint" href="../../">← Étapes de la séance</a>
  <header class="page-head">
    <p class="ctx" id="kicker"></p>
    <h1>Contrôle des temps</h1>
    <p class="hint" id="explain"></p>
  </header>
  <div class="ctl-sum" id="sum"></div>
  <div class="ctl-tools noprint">
    <div class="seg" role="group" aria-label="Affichage">
      <button type="button" data-f="all" aria-pressed="true">Tous</button>
      <button type="button" data-f="warn" aria-pressed="false">À vérifier</button>
    </div>
    <span>
      <label class="btn line small filebtn">Importer des courses PhotoFinish<input type="file" id="pfFiles" accept=".html,.htm,text/html" multiple></label>
      <button type="button" class="btn line small" onclick="print()">Imprimer ou enregistrer en PDF</button>
    </span>
  </div>
  <p class="status" id="pfStatus" aria-live="polite"></p>
  <div id="unknown"></div>
  <div id="table"></div>
  <details class="ctl-courses noprint" id="coursesBox">
    <summary>Courses PhotoFinish prises en compte</summary>
    <div id="courses"></div>
  </details>
</main>
<dialog id="zoom" class="sheet"><img id="zoomImg" alt="" style="width:100%;display:block;border-radius:22px 22px 0 0"><p id="zoomTxt" style="padding:0 18px"></p><div class="actions" style="padding:0 18px 18px"><button class="btn solid" type="button" onclick="this.closest('dialog').close()">Fermer</button></div></dialog>
<script>try{if(window.parent!==window&&window.parent.EPSShell)document.documentElement.classList.add("framed")}catch(e){}</script>
<script src="../hub-data.js?v=3"></script>
<script src="../controle.js?v=3"></script>
</body>
</html>
